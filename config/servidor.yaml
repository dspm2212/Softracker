server:
  host: "0.0.0.0"
  port: 8080
  max_upload_mb: 50

storage:
  # Ruta dentro del contenedor — mapeada al volumen monitoreo_data
  base_dir: "/data"
  parquet_subdir: "parquet"
  audit_log_file: "log/ingest.log"
  reject_dir: "rejected"

auth:
  tokens_file: "/config/tokens.yaml"
  max_clock_skew_min: 30
  # Hash SHA-256 del token de administrador.
  # Generar con: python -c "import hashlib; print(hashlib.sha256(b'TU_TOKEN').hexdigest())"
  admin_token_hash: "CAMBIAR_POR_HASH_SHA256_DEL_TOKEN_ADMIN"

logging:
  level: "INFO"
  file: "/data/log/servidor.log"
  rotate_mb: 50
  backups: 5
