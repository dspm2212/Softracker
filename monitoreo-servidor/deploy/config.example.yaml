server:
  host: "0.0.0.0"
  port: 8080
  max_upload_mb: 50

storage:
  base_dir: "/var/lib/monitoreo-salas"
  parquet_subdir: "parquet"
  audit_log_file: "log/ingest.log"
  reject_dir: "rejected"

auth:
  tokens_file: "/etc/monitoreo-salas/tokens.yaml"
  max_clock_skew_min: 30
  admin_token_hash: "SHA256_HASH_OF_ADMIN_TOKEN_HERE"

logging:
  level: "INFO"
  file: "/var/log/monitoreo-salas/api.log"
  rotate_mb: 50
  backups: 5
